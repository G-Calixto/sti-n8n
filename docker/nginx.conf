# Servido pelo container "frontend". Faz duas coisas:
#  1. entrega o build estatico do Vite (SPA);
#  2. atua como proxy de /api/ para o container "backend".
# Com isso frontend e API ficam na MESMA origem: nao ha CORS, nao ha mixed
# content quando entrar HTTPS, e a porta 3001 nao precisa ficar exposta.

server {
    listen 80;
    server_name _;

    # As imagens das questoes podem chegar a UPLOAD_MAX_SIZE_MB (padrao 10 MB).
    # O default do nginx e 1 MB, o que quebraria o upload silenciosamente com 413.
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Cabecalhos basicos de seguranca (o helmet ja cuida das respostas da API).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # Resolver do Docker: a resolucao do nome "backend" acontece a cada
        # requisicao, entao o nginx sobe mesmo se o backend ainda nao estiver de pe.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sti_backend "backend:3001";
        proxy_pass http://$sti_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A extracao e o feedback chamam o Gemini via n8n e podem levar minutos.
        # O backend usa N8N_TIMEOUT_MS=120000 (2 min); damos folga aqui.
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Streama o upload em vez de bufferizar a imagem inteira em disco.
        proxy_request_buffering off;
    }

    # index.html nunca em cache, para o deploy novo aparecer sem Ctrl+F5.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Assets do Vite tem hash no nome: podem ser cacheados agressivamente.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
